<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Study Vault</title>
    <meta
      name="description"
      content="Study Vault —— 一个现代、精致的个人学习知识库：JavaScript、前端、计算机科学、数学等学习笔记，长期沉淀、随时检索。"
    />
    <meta name="author" content="Study Vault" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Study Vault" />
    <meta property="og:title" content="Study Vault" />
    <meta
      property="og:description"
      content="现代、精致的个人学习知识库：JavaScript、前端、计算机科学、数学等学习笔记，长期沉淀、随时检索。"
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#060714" />
    <script>
      // 在首屏渲染前恢复主题，避免闪烁
      ;(function () {
        try {
          var t = localStorage.getItem('sv-theme')
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
